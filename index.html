<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stundenzettel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Zeiterfassung • KW <span id="kwNum">–</span></div>
      <h1>Wochenkarte</h1>
    </div>
    <button id="resetBtn" type="button">Reset</button>
  </header>

  <div class="grid-2">
    <div class="target-row">
      <div class="txt"><b>Sollstunden</b><span>Ziel für diese Woche</span></div>
      <input type="number" id="target" step="0.25" value="38.5" inputmode="decimal">
    </div>
    <label class="setting-card" for="pauseToggle">
      <div class="setting-text">
        <b>Pausenabzug</b>
        <span id="pauseLabel">30 Min. ab >6h abziehen</span>
      </div>
      <div class="toggle-wrap">
        <input type="checkbox" id="pauseToggle" checked>
        <span class="toggle"></span>
      </div>
    </label>
  </div>

  <div class="summary">
    <div class="gauge-box">
      <svg width="160" height="110" viewBox="0 0 160 110">
        <path d="M12,96 A68,68 0 0 1 148,96" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12" stroke-linecap="round"/>
        <path id="gaugeArc" d="M12,96 A68,68 0 0 1 148,96" fill="none" stroke="#7ac4a0" stroke-width="12" stroke-linecap="round" stroke-dasharray="213" stroke-dashoffset="213"/>
      </svg>
      <div class="needle" id="needle"></div>
      <div class="gauge-readout">
        <div class="val" id="ringVal">0h00</div>
        <div class="lbl">Netto</div>
      </div>
    </div>
    <div class="summary-info">
      <div class="row"><span>Ziel</span><span id="sumTarget">–</span></div>
      <div class="row"><span>Erfasst</span><span id="sumTotal">–</span></div>
      <div class="diff-wrap"><span class="stamp ok" id="diffTag">–</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div id="days"></div>

  <div class="note">
    <span class="dot"></span>
    <div><b id="noteTitle">Pause aktiv:</b> <span id="noteText">Bei mehr als 6h werden automatisch 30 Min. abgezogen. Deaktiviere den Schalter oben, wenn du ohne Pause rechnest.</span></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
